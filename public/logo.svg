<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 旅途手帳 App 圖示：夜色底、日落橘光球沉入地平線、一條路線與終點圓點。
       改這個檔案後執行 npm run icons（PWA 圖示）與 node scripts/ios-assets.mjs（iOS 圖示與啟動畫面）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262320"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.34" cy="0.30" r="0.962" fx="0.34" fy="0.30">
      <stop offset="0" stop-color="#FFE7CD"/>
      <stop offset="0.30" stop-color="#FFA75F"/>
      <stop offset="0.64" stop-color="#FF6A1A"/>
      <stop offset="1" stop-color="#E64700"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A2E" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FF6A1A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect width="1024" height="650"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="494" r="430" fill="url(#glow)"/>
  <circle cx="512" cy="494" r="252" fill="url(#sun)" clip-path="url(#above)"/>
  <rect x="196" y="682" width="508" height="22" rx="11" fill="#F6F3EE"/>
  <circle cx="800" cy="693" r="27" fill="#F6F3EE"/>
</svg>
