  <body>
    <div id="root"></div>
    <!-- 保險：8 秒後畫面還是空的（程式載入失敗、資料庫一直沒回應），關掉原生 App 的啟動畫面並顯示說明，
         不會一直卡在圖示。不依賴主程式，主程式壞掉也會執行；App 之後畫出來就自動移除。 -->
    <script>
      setTimeout(function () {
        var c = window.Capacitor;
        try {
          if (c && typeof c.nativePromise === 'function') c.nativePromise('SplashScreen', 'hide', {}).catch(function () {});
        } catch (e) {}
        var root = document.getElementById('root');
        if (!root || root.firstChild) return;
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;left:0;right:0;top:38%;padding:0 24px;text-align:center;font:17px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif';
        box.innerHTML =
          '<p style="margin:0 0 16px">載入的時間比平常久。<br>如果一直停在這裡，請按「重新載入」，<br>或從多工畫面把 App 滑掉再打開。</p>' +
          '<button type="button" style="font:inherit;font-weight:600;min-height:44px;padding:0 24px;border-radius:22px;border:1.5px solid currentColor;background:none;color:inherit">重新載入</button>';
        box.querySelector('button').onclick = function () {
          location.reload();
        };
        document.body.appendChild(box);
        new MutationObserver(function (_, observer) {
          if (!root.firstChild) return;
          box.remove();
          observer.disconnect();
        }).observe(root, { childList: true });
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
